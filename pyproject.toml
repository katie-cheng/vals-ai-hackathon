[project]
name = "tbi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.109.1",
    "pyyaml>=6.0.3",
    "valkyrie-sdk>=0.36.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
tbi = "tbi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
